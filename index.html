<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SekoGram</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-between p-4">

    <!-- Header / Profil -->
    <div class="w-full max-w-md bg-slate-800 p-4 rounded-2xl shadow-lg flex items-center justify-between">
        <div>
            <h1 id="username" class="text-lg font-bold">Yükleniyor...</h1>
            <p class="text-xs text-slate-400">SekoGram Cüzdanı</p>
        </div>
        <div class="flex items-center space-x-2 bg-slate-700 px-3 py-1.5 rounded-xl">
            <span class="text-cyan-400 font-bold" id="user-diamonds">0</span>
            <span class="text-sm">💎</span>
        </div>
    </div>

    <!-- Görevler Listesi -->
    <div class="w-full max-w-md my-4 flex-1 overflow-y-auto space-y-3">
        <h2 class="text-md font-semibold text-slate-300">Kazan-Kazan Görevleri</h2>
        <div id="tasks-container" class="space-y-2">
            <!-- Dinamik görevler buraya gelecek -->
        </div>
    </div>

    <!-- Alt Bilgi / Butonlar -->
    <div class="w-full max-w-md space-y-2">
        <button onclick="localStorage.clear(); location.reload();" class="w-full bg-rose-600 hover:bg-rose-500 font-semibold py-2.5 rounded-xl transition text-xs">
            Yeni Test Kullanıcısı Oluştur (Reset)
        </button>
        <button onclick="fetchTasks();" class="w-full bg-indigo-600 hover:bg-indigo-500 font-semibold py-3 rounded-xl transition">
            Görevleri Yenile
        </button>
    </div>

    <script>
        const API_BASE = "https://sekogram-backend.vercel.app/api";
        
        // Telegram WebApp verilerini al
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Kullanıcı ID yönetimi ve bakiye hafızası
        let userId = localStorage.getItem('seko_random_user');
        if (!userId) {
            userId = "seko_" + Math.floor(Math.random() * 100000);
            localStorage.setItem('seko_random_user', userId);
            localStorage.setItem('seko_balance_' + userId, '0');
        }
        
        document.getElementById("username").innerText = "@" + userId;

        // Cüzdanı hafızadan ekrana yazdır
        function updateWalletUI() {
            const currentBalance = localStorage.getItem('seko_balance_' + userId) || '0';
            document.getElementById("user-diamonds").innerText = currentBalance;
        }

        // Görevleri Çek
        async function fetchTasks() {
            const container = document.getElementById("tasks-container");
            container.innerHTML = "<p class='text-center text-slate-400'>Yükleniyor...</p>";

            try {
                const res = await fetch(`${API_BASE}/tasks`);
                const data = await res.json();
                
                if (data.status === "success") {
                    container.innerHTML = "";
                    data.tasks.forEach(task => {
                        container.innerHTML += `
                            <div class="bg-slate-800 p-4 rounded-xl flex items-center justify-between">
                                <div>
                                    <h3 class="font-semibold text-sm">${task.title}</h3>
                                    <p class="text-xs text-slate-400">${task.description}</p>
                                    <span class="text-xs text-cyan-400 mt-1 inline-block">+${task.reward_diamonds} Elmas</span>
                                </div>
                                <button onclick="completeTask('${task.id}', ${task.reward_diamonds})" class="bg-emerald-600 hover:bg-emerald-500 text-xs px-4 py-2 rounded-lg font-medium transition">
                                    Tamamla
                                </button>
                            </div>
                        `;
                    });
                }
            } catch (err) {
                container.innerHTML = "<p class='text-center text-red-400'>Görevler yüklenemedi!</p>";
            }
        }

        // Görevi Tamamlama ve Bakiyeyi Artırma
        async function completeTask(taskId, reward) {
            try {
                const res = await fetch(`${API_BASE}/tasks/complete?user_id=${userId}&task_id=${taskId}`, { method: 'POST' });
                const data = await res.json();
                
                if (res.ok) {
                    alert(data.message || "Tebrikler, ödül alındı!");
                    
                    // Bakiyeyi güncelle ve hafızaya kaydet
                    let currentBalance = parseInt(localStorage.getItem('seko_balance_' + userId) || '0');
                    currentBalance += reward;
                    localStorage.setItem('seko_balance_' + userId, currentBalance);
                    
                    updateWalletUI();
                } else {
                    alert(data.detail || data.message || "Bu görevi zaten tamamladınız!!");
                }
            } catch (err) {
                alert("Bağlantı hatası!");
            }
        }

        // Sayfa açıldığında çalıştır
        updateWalletUI();
        fetchTasks();
    </script>
</body>
</html>
